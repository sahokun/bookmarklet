version: 2
# 月 1 回、エコシステムごとに「マイナー・パッチ」と「メジャー」を別のグループで届ける。
# cooldown で公開から 7 日たったバージョンだけを対象にする。
# セキュリティ更新（リポジトリ設定で有効）は、エコシステムごとに 1 つの PR にまとめる。cooldown は掛からないので、
# 公開から 7 日未満の版を含むことがある（マージの前に確かめる）。
# 言語のエコシステム（cargo・npm など）は、同じ形のブロックを足す。
# target-branch は付けない。付けたブロックの設定はセキュリティ更新に効かず、グループにまとまらない。
updates:
  - package-ecosystem: npm
    directory: /
    open-pull-requests-limit: 2
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      npm-security:
        applies-to: security-updates
        patterns: ["*"]
      npm-monthly:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
      npm-major:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [major]
