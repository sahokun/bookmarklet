version: 2
# 月 1 回、エコシステムごとに「マイナー・パッチ」と「メジャー」を別のグループで届ける。
# cooldown で公開から 7 日たったバージョンだけを対象にする。
# セキュリティ更新はリポジトリ設定で有効にし、グループ化も cooldown も掛からない。
# 言語のエコシステム（cargo・npm など）は、同じ形のブロックを足す。
# develop ありの運用では、各ブロックに target-branch: develop を足す。
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: develop
    open-pull-requests-limit: 2
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      npm-monthly:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
      npm-major:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [major]
